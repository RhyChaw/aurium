<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Aurium</title>
<link rel="stylesheet" href="/style.css">
</head>
<body>
<header>
  <h1>Aurium</h1>
  <div class="meta">
    <span id="project-name">—</span>
    <span class="sep">·</span>
    <span id="conn" class="conn conn-connecting">connecting</span>
  </div>
</header>

<nav id="tabs"></nav>

<!-- A live region: the result of an action must reach a screen reader too. -->
<p id="notice" class="notice" role="status" aria-live="polite" hidden></p>

<main id="panel" data-panel=""></main>

<p class="hint-bar">
  <span><kbd>1</kbd>–<kbd>6</kbd> panels</span>
  <span><kbd>a</kbd> approve top</span>
  <span><kbd>x</kbd> reject top</span>
  <span><kbd>j</kbd>/<kbd>k</kbd> agents</span>
  <span><kbd>r</kbd> refresh</span>
</p>

<!-- Modules, loaded natively. No bundler, so `make build` needs only Go. -->
<script type="module" src="/app.js"></script>
</body>
</html>
