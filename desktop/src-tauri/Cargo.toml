[package]
name = "aurium-desktop"
version = "0.1.1"
edition = "2021"
rust-version = "1.77"
description = "Desktop shell for the Aurium daemon"
license = "MIT"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-notification = "2"
serde = { version = "1", features = ["derive"] }

[profile.release]
strip = true
lto = true
